[workspace]
members = [
  "happ/zomes/profiles",
  "happ/zomes/profiles_integrity",
  "happ/zomes/projects",
  "happ/zomes/projects_integrity",
]
resolver = "2"

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace.dependencies]
hdi = "0.7.0-rc.0"
hdk = "0.6.0-rc.0"
holochain = { version = "0.6.0-rc.1" }
holo_hash = {version = "0.6.0-rc.0", features = ["encoding"]}
holochain_types = { version = "0.6.0-rc.1" }
holochain_serialized_bytes = "0.0.56"
