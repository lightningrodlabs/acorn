[workspace]
members = [
  # hdk_crud is already an *implicit* member: it is a path dependency of the
  # zomes below and lives inside the workspace directory, so cargo adds it
  # automatically (confirmed with `cargo metadata --no-deps`). Listing it
  # explicitly changes nothing but makes it obvious that the
  # [workspace.dependencies] pins below govern it too -- it writes
  # `hdk = { workspace = true }`.
  "lib/hdk_crud",
  "happ/zomes/profiles",
  "happ/zomes/profiles_integrity",
  "happ/zomes/projects",
  "happ/zomes/projects_integrity",
]
resolver = "2"

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace.dependencies]
# Exact pins, deliberately. The DNA hash is a function of the compiled integrity
# wasm, so a later rebuild against a different hdi/hdk would produce a different
# network. Never relax these to caret ranges. They are frozen per DNA line:
# moving them means a new dnaVersion and network, as 14.0.0 did for 0.7.1.
hdi = "=0.8.1"
hdk = "=0.7.1"
holo_hash = { version = "=0.7.1", features = ["encoding"] }
holochain_types = { version = "=0.7.1" }
holochain_serialized_bytes = "=0.0.57"

# Intra-repo crates, declared here so that no member Cargo.toml carries a
# relative parent path of its own. Gate G2 greps for dependencies that escape
# the repository (nobody else could build, CI could not verify); these never did
# -- they resolve inside happs/ -- but the workspace form is what R4 prescribes
# for a vendored crate and it makes the gate's grep unambiguous.
hdk_crud = { path = "lib/hdk_crud", features = ["no_example"] }
profiles_integrity = { path = "happ/zomes/profiles_integrity" }
projects_integrity = { path = "happ/zomes/projects_integrity" }
